<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>审稿 · Rolling Buffer</title><style>
:root{color-scheme:light dark;--paper:#f7f7ef;--ink:#17251e;--muted:#486054;--line:#becbbf;--green:#136448}@media(prefers-color-scheme:dark){:root{--paper:#131d18;--ink:#e8f3e9;--muted:#abc1b3;--line:#456152;--green:#82d9ae}}*{box-sizing:border-box}body{margin:0 auto;width:min(100% - 2rem,44rem);background:var(--paper);color:var(--ink);font:1rem/1.65 system-ui,sans-serif;padding-bottom:3rem}header{padding:1rem 0;border-bottom:1px solid var(--line)}a{color:var(--green);text-underline-offset:.18em}main{padding:1.4rem 0}.box{border:1px solid var(--line);padding:1rem 1.15rem;border-radius:.6rem;margin:1rem 0}h1,h2{line-height:1.24}h2{font-size:1.15rem}.muted{color:var(--muted)}label{display:block;margin:.45rem 0}input:not([type=radio]):not([type=checkbox]),textarea{display:block;width:100%;max-width:38rem;background:var(--paper);color:var(--ink);border:1px solid var(--line);padding:.55rem;border-radius:.25rem;font:inherit}textarea{min-height:5rem}fieldset{border:1px solid var(--line);margin:1rem 0}button{background:var(--paper);color:var(--green);padding:.45rem .75rem;border:1px solid var(--green);border-radius:.35rem;font:inherit;cursor:pointer}.actions{display:flex;gap:.9rem;align-items:center;flex-wrap:wrap}textarea[readonly]{font-family:ui-monospace,monospace}[hidden]{display:none!important}</style></head>
<body><header><a href="./">← Rolling Buffer</a></header><main><h1>审稿工作台</h1><p class="muted">在 GitHub 登录并查看私有稿件，在这里整理审核意见，再由你本人到 GitHub 留言。此页不会读取、保存、提交或发布任何内容。</p>
<section class="box" aria-labelledby="open-title"><h2 id="open-title">1. 打开稿件</h2><p class="actions"><a href="https://github.com/blueyo0/rolling-buffer-review/issues" target="_blank" rel="noopener noreferrer">打开私有审稿单列表 ↗</a><a href="https://github.com/blueyo0/rolling-buffer-review/blob/main/REVIEW.md" target="_blank" rel="noopener noreferrer">稿件索引与审稿说明 ↗</a></p><p class="muted">从审稿单打开固定版本，不要用可能变化的 main 链接确认发布版本。</p></section>
<form class="box" id="review"><h2>2. 整理决定</h2><label for="issue">审稿单编号（可选，便于直达）</label><input id="issue" type="text" inputmode="numeric" pattern="[1-9][0-9]{0,8}" maxlength="9" placeholder="例如 1">
<label for="sha">版本提交号（批准时必填）</label><input id="sha" type="text" minlength="8" maxlength="40" pattern="[0-9a-fA-F]{8,40}" placeholder="从审稿单复制">
<fieldset><legend>审核决定</legend><label><input type="radio" name="decision" value="revise" required> 要求修改</label><label><input type="radio" name="decision" value="hold"> 暂不发布</label><label><input type="radio" name="decision" value="approve"> 批准发布该版本</label></fieldset>
<fieldset id="feature" hidden><legend>首页精选</legend><label><input type="radio" name="feature" value="yes" disabled> 加入精选</label><label><input type="radio" name="feature" value="no" disabled> 不加入精选</label></fieldset>
<label for="notes">修改意见（要求修改时必填）</label><textarea id="notes" maxlength="4000" placeholder="例如：第 3 节需要一条可核对的来源。"></textarea><p><button type="submit">生成留言</button></p></form>
<section class="box" id="result" aria-labelledby="result-title" hidden><h2 id="result-title">3. 到 GitHub 留言</h2><label for="comment">预览确认用的留言</label><textarea id="comment" readonly></textarea><p class="actions"><button type="button" id="copy">复制留言</button><a id="issue-link" href="https://github.com/blueyo0/rolling-buffer-review/issues" target="_blank" rel="noopener noreferrer">去 GitHub 审稿单 ↗</a></p><p id="status" role="status" class="muted"></p><p class="muted">在 GitHub 用自己的账号提交后，回 ChatGPT 告诉我查看。是否批准以 GitHub 本人留言和对应版本为准，不会自动发布。</p></section>
<noscript><p>关闭 JavaScript 时仍可使用上面的 GitHub 入口，直接在审稿单里留言。</p></noscript></main>
<script>(()=>{'use strict';const get=(id)=>document.getElementById(id);const f=get('review'),sha=get('sha'),feature=get('feature'),notes=get('notes'),result=get('result'),out=get('comment'),status=get('status');const radios=[...feature.querySelectorAll('input')];const sync=()=>{const choice=f.querySelector('input[name=decision]:checked')?.value;const approving=choice==='approve';sha.required=approving;notes.required=choice==='revise';feature.hidden=!approving;for(const r of radios){r.disabled=!approving;r.required=approving}result.hidden=true;};f.addEventListener('input',sync);f.addEventListener('submit',(e)=>{e.preventDefault();const data=new FormData(f);const version=sha.value.trim().toLowerCase();const note=notes.value.trim();const d=data.get('decision');if(d==='revise'&&!note){notes.setCustomValidity('请填写修改意见。');notes.reportValidity();return;}const v=version?' '+version:'';out.value=d==='approve'?'批准发布'+v+'，'+(data.get('feature')==='yes'?'加入精选':'不加入精选')+(note?'\n\n备注：'+note:''):d==='revise'?'要求修改'+v+'：'+note:'暂不发布'+v+(note?'\n\n备注：'+note:'');const id=get('issue').value;get('issue-link').href='https://github.com/blueyo0/rolling-buffer-review/issues'+(id?'/'+id:'');result.hidden=false;status.textContent='留言已生成，尚未提交。';out.focus();});notes.addEventListener('input',()=>notes.setCustomValidity(''));get('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(out.value);status.textContent='已复制。请到 GitHub 粘贴并提交。';}catch{out.select();status.textContent='请手动复制选中的留言。';}});sync();})();</script></body></html>
