<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if page.is_home %}
  <meta name="description" content="一个持续更新的知识空间。">
  <title>{{ site.title | escape }}</title>
  {% else %}
  {%- seo -%}
  {% endif %}
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/rolling-buffer.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/rolling.css' | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
</head>
